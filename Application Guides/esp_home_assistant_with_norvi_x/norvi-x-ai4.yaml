# NORVI X + X-AI4 (4 x 4-20 mA analog inputs) - ESPHome example
# Hardware: NORVI X CPU-ESPS3-X1 (ESP32-S3, 16 MB flash, 2 MB quad PSRAM) + X-AI4 module
# Each channel is read as 4-20 mA and scaled to a 0-10 value.
# Tested on: ESPHome 2026.8.0 / 2026-11-16

substitutions:
  name: norvi-x-ai4
  friendly_name: "NORVI X AI4"
  ai4_address: "0x49"      # DIP 1 ON, DIP 2-4 OFF (factory default). Other options: 0x48, 0x4A, 0x4B
  ma_per_volt: "10"        # 5 ohm shunt x20 amplifier: 20 mA -> 2.0 V, so mA = V x 10.
                           # NOT stated in the datasheet. Verify with a calibrated current source.
  scale_min: "0.0"         # value shown when the loop carries 4 mA
  scale_max: "10.0"        # value shown when the loop carries 20 mA

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: quad               # N16R2 = 2 MB quad PSRAM

logger:
  hardware_uart: USB_SERIAL_JTAG   # logs over the USB port

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# I2C bus shared by all NORVI X modules (SDA = IO8, SCL = IO9)
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true               # the X-AI4 should appear in the log at the address above

# ADS1115 16-bit ADC on the X-AI4
ads1115:
  - id: ai4_adc
    address: ${ai4_address}

sensor:
  # Channel mapping: terminal AIN1..AIN4 -> ADS1115 input A0..A3 (single-ended against GND).
  # gain 2.048 = +/-2.048 V full scale, which covers 20 mA (2.0 V) with a little headroom.
  # Filter order: volts -> mA, mA -> scaled value, clamp, then smoothing.
  - platform: ads1115
    ads1115_id: ai4_adc
    name: "AI4 Channel 1"
    multiplexer: A0_GND
    gain: 2.048
    update_interval: 1s
    accuracy_decimals: 2
    unit_of_measurement: ""     # remove the default "V"; the value is a 0-10 scale
    device_class: ""            # remove the default voltage class
    filters:
      - multiply: ${ma_per_volt}                # volts -> mA
      - calibrate_linear:                       # mA -> scaled value (4 mA = min, 20 mA = max)
          - 4.0 -> ${scale_min}
          - 20.0 -> ${scale_max}
      - clamp:                                  # keep the result inside the scale
          min_value: ${scale_min}
          max_value: ${scale_max}
      - sliding_window_moving_average:          # smooth electrical noise
          window_size: 5
          send_every: 1

  - platform: ads1115
    ads1115_id: ai4_adc
    name: "AI4 Channel 2"
    multiplexer: A1_GND
    gain: 2.048
    update_interval: 1s
    accuracy_decimals: 2
    unit_of_measurement: ""     # remove the default "V"; the value is a 0-10 scale
    device_class: ""            # remove the default voltage class
    filters:
      - multiply: ${ma_per_volt}
      - calibrate_linear:
          - 4.0 -> ${scale_min}
          - 20.0 -> ${scale_max}
      - clamp:
          min_value: ${scale_min}
          max_value: ${scale_max}
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: ads1115
    ads1115_id: ai4_adc
    name: "AI4 Channel 3"
    multiplexer: A2_GND
    gain: 2.048
    update_interval: 1s
    accuracy_decimals: 2
    unit_of_measurement: ""     # remove the default "V"; the value is a 0-10 scale
    device_class: ""            # remove the default voltage class
    filters:
      - multiply: ${ma_per_volt}
      - calibrate_linear:
          - 4.0 -> ${scale_min}
          - 20.0 -> ${scale_max}
      - clamp:
          min_value: ${scale_min}
          max_value: ${scale_max}
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: ads1115
    ads1115_id: ai4_adc
    name: "AI4 Channel 4"
    multiplexer: A3_GND
    gain: 2.048
    update_interval: 1s
    accuracy_decimals: 2
    unit_of_measurement: ""     # remove the default "V"; the value is a 0-10 scale
    device_class: ""            # remove the default voltage class
    filters:
      - multiply: ${ma_per_volt}
      - calibrate_linear:
          - 4.0 -> ${scale_min}
          - 20.0 -> ${scale_max}
      - clamp:
          min_value: ${scale_min}
          max_value: ${scale_max}
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1