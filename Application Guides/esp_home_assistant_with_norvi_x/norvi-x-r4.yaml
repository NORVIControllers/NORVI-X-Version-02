# NORVI X + X-R4 (4 relays, 5 A) - ESPHome example
# Relays are driven by a PCA9538 I2C expander. Default address 0x73 (DIP 1 and 2 both OFF);
# other addresses: 0x70-0x72. Relay n is expander pin n-1.
# SAFETY: test with a low-voltage load or a multimeter before connecting mains.
# Tested on: ESPHome 2026.8.0 / 2026-11-16

substitutions:
  name: norvi-x-r4
  friendly_name: "NORVI X R4"
  r4_address: "0x73"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: quad

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true               # the R4 should show up at ${r4_address}

# PCA9538 reset line is wired to IO21 (active low). Hold it high so the expander runs.
# setup_priority makes this start before the expander is initialised.
# (If the R4 was missing from your I2C scan, this is the first thing to check.)
switch:
  - platform: gpio
    id: pca_reset
    internal: true
    pin: GPIO21
    restore_mode: ALWAYS_ON
    setup_priority: 2000

  # Relays. restore_mode ALWAYS_OFF = safe start-up state (all relays open after a reboot).
  # Polarity: NORVI's test sketch sets bit n to switch relay n+1 ON, so no inversion is used.
  - platform: gpio
    name: "R4 Relay 1"
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: pca9538_relays
      number: 0
      mode: OUTPUT
  - platform: gpio
    name: "R4 Relay 2"
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: pca9538_relays
      number: 1
      mode: OUTPUT
  - platform: gpio
    name: "R4 Relay 3"
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: pca9538_relays
      number: 2
      mode: OUTPUT
  - platform: gpio
    name: "R4 Relay 4"
    restore_mode: ALWAYS_OFF
    pin:
      pca9554: pca9538_relays
      number: 3
      mode: OUTPUT

# The PCA9538 uses the same register layout (output 0x01, config 0x03) as the PCA9554.
pca9554:
  - id: pca9538_relays
    address: ${r4_address}
